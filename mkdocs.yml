site_name: Hedging Handbook
site_url: https://qwertytam.github.io/deltadewa-handbook/
site_description: A comprehensive guide to hedging strategies and risk management.

repo_url: https://github.com/qwertytam/deltadewa-handbook
repo_name: qwertytam/deltadewa-handbook
edit_uri: edit/main/docs/

# Rendered into the footer of every page. Material inserts this verbatim, so
# the link must be a full URL: a root-absolute path would 404 under a local
# `mkdocs serve`, which is not served from the /deltadewa-handbook/ prefix.
copyright: >
  <strong>Educational and operational reference only — not investment
  advice.</strong>
  See
  <a href="https://qwertytam.github.io/deltadewa-handbook/preface/important-limitations/">Important
  Limitations</a>.
  &copy; 2025 Tom Marshall.

# Surface broken internal links, anchors and orphaned files as warnings.
# CI builds with --strict, which promotes these to hard errors; local
# `mkdocs serve` keeps them as warnings so drafting is not blocked.
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

# index.md is the site landing page, intentionally reachable via the header
# title rather than as a duplicate sidebar entry alongside "Preface".
not_in_nav: |
  index.md

theme:
  name: material
  features:
    # navigation.expand is deliberately NOT enabled: with 11 parts and ~100
    # pages it renders the entire handbook as one long sidebar. Sections stay
    # collapsed and expand on demand instead.
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - toc.follow
    - content.code.copy
    - content.action.edit
    - search.suggest
    - search.highlight
    - search.share
  icon:
    repo: fontawesome/brands/github
  palette:
    # Three states: follow the reader's OS setting by default, with an
    # explicit override in each direction.
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to system preference

plugins:
  - search

markdown_extensions:
  # attr_list supplies the explicit `{ #slug }` anchors on the References
  # page, so citation links stay stable if an entry's title is reworded.
  - attr_list
  - footnotes
  - md_in_html
  - admonition          # `!!! note` / `!!! warning` callouts
  - pymdownx.details    # makes admonitions collapsible with `???`
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: true

extra_javascript:
  - javascripts/config.js
  # Pinned to an exact version: a floating `mathjax@3` tag silently changes
  # the executable served to every reader. The polyfill.io script that used
  # to sit here was removed — that domain was the vector of the June 2024
  # supply-chain attack and no longer resolves. MathJax 3 needs no ES6
  # polyfill in any currently supported browser.
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js

