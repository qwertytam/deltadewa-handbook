name: Deploy MkDocs to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Least privilege: the Pages deployment is uploaded as an artifact and
# published over OIDC, so the workflow never needs write access to the
# repository contents (the previous `mkdocs gh-deploy` flow did).
permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-flight deploy finish rather than being cancelled, but collapse
# queued runs so rapid merges do not race each other onto Pages.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache virtualenv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py3.14-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        run: poetry install --only dev --no-interaction

      # --strict promotes MkDocs warnings to errors, so broken internal
      # links, missing anchors and orphaned pages fail the build instead of
      # shipping silently.
      - name: Build site
        run: poetry run mkdocs build --strict

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
