name: CI

# `pull_request` covers every branch on its way in. `push` is scoped to `main`
# only so that commits which bypass a pull request (Dependabot auto-merge, an
# admin pushing directly) are still verified. Listing other branches under
# `push` would double-fire: a same-repo branch would run once for the push and
# again for the pull request.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdown:
    name: Lint Markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Rules and exclusions live in .markdownlint-cli2.jsonc, which the VS
      # Code markdownlint extension reads too, so the editor and CI agree.
      # Pinned so a new rule in a future release cannot fail an unrelated PR.
      - name: Run markdownlint
        run: npx --yes markdownlint-cli2@0.23.2

      # `docs/` publishes on every push to main, so an editorial note left in a
      # page ships to readers. markdownlint has no rule that expresses this, so
      # it is its own step rather than a custom rule. Runs even if markdownlint
      # failed, so one PR surfaces both classes of problem at once.
      - name: No editorial notes in docs
        if: '!cancelled()'
        run: |
          if grep -rInE '(TODO|TBD|FIXME|Editing note)' docs/; then
            echo "::error::Editorial note found in docs/ — remove it or move it to an issue."
            exit 1
          fi

  build:
    name: Build docs (strict)
    runs-on: ubuntu-latest
    # `pages: read` lets configure-pages query the Pages settings below. No
    # write scope is needed because nothing in this workflow deploys.
    permissions:
      contents: read
      pages: read
    steps:
      # fetch-depth: 0 to match deploy.yml — see the comment there. Not
      # required for --strict itself, but this job claims to build the exact
      # site deploy.yml publishes, which is only true if both see full history.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Literally the same steps deploy.yml runs, so a pull request cannot
      # merge a broken cross-reference, missing anchor or orphaned page.
      - uses: ./.github/actions/build-site

      # --strict validates cross-references *within* this handbook, so an
      # inbound link from another repository is invisible to it: renaming a
      # heading here breaks a citation there and nothing in either repository
      # fails. .github/cross-repo-anchors.txt enumerates the anchors other
      # repos cite; this step asserts each one still exists in the built site.
      # It reads the built HTML rather than the Markdown source, so it also
      # catches an explicit anchor that was removed and left to fall back to a
      # generated slug.
      - name: Assert cross-repo anchors
        run: |
          set -uo pipefail

          failed=0
          while IFS= read -r entry; do
            page="site/${entry%%#*}index.html"
            frag="${entry#*#}"

            if [ ! -f "$page" ]; then
              echo "::error::$entry - page not built ($page is missing)"
              failed=1
            elif ! grep -qF "id=\"$frag\"" "$page"; then
              echo "::error::$entry - page builds, but nothing has id=\"$frag\""
              failed=1
            else
              echo "ok  $entry"
            fi
          done < <(sed -e '/^[[:space:]]*#/d' -e '/^[[:space:]]*$/d' \
                       .github/cross-repo-anchors.txt)

          if [ "$failed" -ne 0 ]; then
            echo "::error::A heading cited from another repository lost its anchor."
            echo "Restore the { #slug }, or change the citing repository in the"
            echo "same breath and update .github/cross-repo-anchors.txt."
            exit 1
          fi

      # These two steps exist only to exercise the Pages packaging path on a
      # pull request. The artifact is produced and then discarded — nothing
      # here deploys. Without them, a Dependabot bump to configure-pages or
      # upload-pages-artifact would be the one change in the repository that
      # no check covers: it would merge green and fail only after landing on
      # main, with the published site already broken.
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
