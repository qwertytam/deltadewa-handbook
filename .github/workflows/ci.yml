name: CI

# `pull_request` covers every branch on its way in. `push` is scoped to `main`
# only so that commits which bypass a pull request (Dependabot auto-merge, an
# admin pushing directly) are still verified. Listing other branches under
# `push` would double-fire: a same-repo branch would run once for the push and
# again for the pull request.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdown:
    name: Lint Markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Rules and exclusions live in .markdownlint-cli2.jsonc, which the VS
      # Code markdownlint extension reads too, so the editor and CI agree.
      # Pinned so a new rule in a future release cannot fail an unrelated PR.
      - name: Run markdownlint
        run: npx --yes markdownlint-cli2@0.23.2

  build:
    name: Build docs (strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache virtualenv
        uses: actions/cache@v6
        with:
          path: .venv
          key: venv-${{ runner.os }}-py3.14-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        run: poetry install --only dev --no-interaction

      # Same strict build the deploy workflow runs, so a pull request cannot
      # merge a broken cross-reference, missing anchor or orphaned page.
      - name: Build site
        run: poetry run mkdocs build --strict
